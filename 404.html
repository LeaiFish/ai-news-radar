<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面不存在 · AI News Radar</title>
    <script>
      (function () {
        var path = window.location.pathname || "";
        var match = path.match(/^(.*\/)?topics\/([^/]+)\/?$/);
        if (match && match[2] && match[2] !== "index.html") {
          var prefix = match[1] || "/";
          var target = prefix + "topics/?id=" + encodeURIComponent(match[2]);
          window.location.replace(target + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <p>页面不存在。<a id="homeLink" href="./">返回首页</a></p>
    <script>
      (function () {
        var path = window.location.pathname || "";
        var marker = path.indexOf("/topics/");
        var home = marker >= 0 ? path.slice(0, marker + 1) : "./";
        document.getElementById("homeLink").setAttribute("href", home);
      })();
    </script>
  </body>
</html>
