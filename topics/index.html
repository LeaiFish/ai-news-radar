<!doctype html>
<html lang="zh-CN" data-radar-surface="topics" data-root="../">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>主题 · AI News Radar</title>
    <meta name="description" content="按产业透镜、公司与模型、技术方向浏览主题。顶部可筛选要看的主题。" />
    <link rel="icon" href="../assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/styles.css?v=topics-2" />
    <link rel="stylesheet" href="../assets/topics.css?v=topics-2" />
    <link rel="stylesheet" href="../assets/sidebar.css?v=sidebar-1" />
    <script src="../assets/sidebar.js?v=sidebar-1"></script>
  </head>
  <body>
    <a class="skip-link" href="#topicsMain">跳到主题内容</a>
    <main class="shell topics-shell">
      <header class="hero topics-hero">
        <div class="hero-main">
          <div class="hero-headline">
            <a class="topics-home-logo" href="../" aria-label="返回 AI News Radar">
              <img class="hero-logo" src="../assets/logo.svg" alt="" />
            </a>
            <div>
              <p class="topics-kicker"><a href="./">主题</a> · AI News Radar</p>
              <h1 id="topicsTitle">按主题看 AI</h1>
              <p class="topics-lead" id="topicsLead">按产业透镜、公司与模型、技术方向浏览主题。顶部可筛选要看的主题。</p>
              <div class="hero-updated">
                <span class="updated-label">更新时间</span>
                <span class="updated" id="updatedAt">加载中...</span>
              </div>
            </div>
          </div>
        </div>
        <div class="hero-meta">
          <nav class="hero-links" aria-label="页面入口">
            <a class="hero-link" href="../">返回雷达</a>
            <a class="hero-link" href="../classic/">经典版</a>
            <a class="hero-link" href="./" aria-current="page">全部主题</a>
          </nav>
        </div>
      </header>
      <nav class="topics-filter" id="topicsFilter" aria-label="按主题筛选" hidden></nav>
      <section id="topicsMain" class="topics-main" aria-live="polite">
        <p class="topics-status" id="topicsStatus">正在加载主题…</p>
      </section>
    </main>
    <template id="itemTpl">
      <article class="news-card">
        <div class="news-card-body">
          <div class="meta-row">
            <span class="curated-badge" hidden>精选</span>
            <span class="site"></span>
            <span class="source"></span>
          </div>
          <a class="title" target="_blank" rel="noopener noreferrer"></a>
          <p class="news-summary"></p>
          <div class="why-box" hidden>
            <span class="why-label">推荐理由：</span>
            <span class="why-text"></span>
          </div>
        </div>
      </article>
    </template>
    <script src="../assets/topics.js?v=topics-2" defer></script>
  </body>
</html>
