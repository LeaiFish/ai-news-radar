name: Update AI News Snapshot

on:
  push:
    branches: [master]
    paths:
      - 'scripts/free_news_content.py'
      - 'scripts/update_news.py'
      - 'scripts/wechat_sources.py'
      - 'scripts/wechat_cloud.py'
      - 'scripts/wechat_http.py'
      - 'config/wechat_sources.json'
      - 'data/bridge/wechat-accounts.json'
      - 'scripts/build_topics.py'
      - '.github/workflows/update-news.yml'
      - 'apps/web/**'
      - 'site/**'
      - 'packages/contracts/**'
      - 'scripts/export-public-news.py'
      - 'config/focus_sources.json'
      - 'config/topics.json'
  workflow_dispatch:
    inputs:
      refresh_wechat:
        description: 'Discover and verify official WeChat articles before publishing'
        type: boolean
        default: false
  schedule:
    - cron: "40 2 * * *"           # 公众号：北京时间每天 10:40，由云端采集和核验
    # 分时段节奏（2026-08-30 卡尔定，全部 UTC；北京 = UTC+8）：
    # 高峰（北京周一至五 9-12 / 14-18）保持每小时；其余空闲时段 3 小时一轮；深夜 4 小时一轮。
    - cron: "17 1-3,6-9 * * 1-5"   # 高峰每小时：北京工作日 09:17-11:17、14:17-17:17
    - cron: "17 5,11,14,23 * * *"  # 空闲 3h：北京每天 13:17、19:17、22:17、次日 07:17
    - cron: "17 2,8 * * 6,0"       # 周末补空闲档：北京周六日 10:17、16:17
    - cron: "17 17,21 * * *"       # 深夜 4h：北京每天 01:17、05:17

concurrency:
  group: update-ai-news-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  update:
    timeout-minutes: 75
    runs-on: ubuntu-latest
    env:
      RADAR_FREE_ONLY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover and verify public WeChat articles
        id: wechat
        if: github.event.schedule == '40 2 * * *' || inputs.refresh_wechat == true
        run: |
          set +e
          python scripts/wechat_cloud.py --output "$RUNNER_TEMP/wechat-candidates.json"
          discovery=$?
          if [ "$discovery" -ne 0 ] && [ "$discovery" -ne 2 ]; then exit 3; fi
          python scripts/wechat_sources.py --candidates "$RUNNER_TEMP/wechat-candidates.json"
          verification=$?
          set -e
          if [ "$verification" -ne 0 ] && [ "$verification" -ne 2 ]; then exit 3; fi
          # Only the public allowlist is committed; discovery responses stay in runner temp.
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, os
          from scripts.publish_wechat_snapshot import public_snapshot
          from scripts.wechat_cloud import collection_state
          path = Path('data/bridge/wechat-accounts.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          run = payload['last_run']
          discovery = json.loads(Path(os.environ['RUNNER_TEMP'], 'wechat-candidates.json').read_text(encoding='utf-8'))
          if discovery.get('supplemental_discovery', {}).get('ok') is False:
              run['errors'].append({'error': 'supplemental_discovery_failed'})
          for probe in discovery.get('supplemental_discovery', {}).get('pilot_queries', []):
              if not probe.get('ok'):
                  run['errors'].append({'error': 'pilot_discovery_failed'})
          run['collection_state'] = collection_state(run, discovery)
          run['ok'] = run['collection_state'] == 'complete'
          run['search_errors'] = [r for r in discovery['searches'] if not r['ok']]
          Path(os.environ['RUNNER_TEMP'], 'wechat-result.json').write_text(json.dumps(run, ensure_ascii=False), encoding='utf-8')
          path.write_text(json.dumps(public_snapshot(payload, datetime.now(timezone.utc)), ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          if [ "$discovery" -eq 2 ] || [ "$verification" -eq 2 ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
            echo "::warning::WeChat collection was incomplete; publishing only verified records with incomplete collection status."
          else
            echo "partial=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare OPML
        env:
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          mkdir -p feeds
          if [ -n "$FOLLOW_OPML_B64" ]; then
            echo "$FOLLOW_OPML_B64" | base64 --decode > feeds/follow.opml
            echo "Loaded feeds/follow.opml from FOLLOW_OPML_B64 secret"
          elif [ -f feeds/follow.example.opml ]; then
            cp feeds/follow.example.opml feeds/follow.opml
            echo "Loaded public demo OPML from feeds/follow.example.opml"
          else
            echo "No OPML file available; RSS OPML is optional"
          fi

      - name: Prepare X bridge items
        env:
          X_BRIDGE_ITEMS_B64: ${{ secrets.X_BRIDGE_ITEMS_B64 }}
        run: |
          mkdir -p data/bridge
          if [ -n "$X_BRIDGE_ITEMS_B64" ]; then
            echo "$X_BRIDGE_ITEMS_B64" | base64 --decode > data/bridge/x-items.json
            echo "Loaded data/bridge/x-items.json from X_BRIDGE_ITEMS_B64 secret"
          elif [ -f data/bridge/x-items.json ]; then
            echo "Using committed data/bridge/x-items.json"
          else
            echo "No X bridge items file; private X cookie bridge is optional"
          fi

      - name: Update data
        env:
          EMAIL_DIGEST_ENABLED: "0"
          AGENTMAIL_PROVIDER: ${{ vars.AGENTMAIL_PROVIDER }}
          AGENTMAIL_CLI: ${{ vars.AGENTMAIL_CLI }}
          # Body reads are limited to explicitly authorized local/private runs.
          AGENTMAIL_RESOLVE_PUBLIC_URLS: "0"
          EMAIL_DIGEST_INCLUDE_IN_RADAR: ${{ secrets.EMAIL_DIGEST_INCLUDE_IN_RADAR || vars.EMAIL_DIGEST_INCLUDE_IN_RADAR }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
          AGENTMAIL_API_BASE_URL: ${{ vars.AGENTMAIL_API_BASE_URL }}
          AGENTMAIL_LIMIT: ${{ vars.AGENTMAIL_LIMIT }}
          AGENTMAIL_ALLOWED_SENDER_DOMAINS: ${{ vars.AGENTMAIL_ALLOWED_SENDER_DOMAINS }}
          # Paid X/social sources (X API, SocialData, TikHub): keys live in
          # secrets; optional tuning variables override code defaults.
          # Policy is key-first: a key present => the source runs; ENABLED is
          # optional and only needs setting to 0 to force it off.
          X_API_ENABLED: "0"
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SOCIALDATA_ENABLED: "0"
          SOCIALDATA_API_KEY: ${{ secrets.SOCIALDATA_API_KEY }}
          SOCIALDATA_QUERY: ${{ vars.SOCIALDATA_QUERY }}
          SOCIALDATA_SEARCH_TYPE: ${{ vars.SOCIALDATA_SEARCH_TYPE }}
          SOCIALDATA_MAX_RESULTS: ${{ vars.SOCIALDATA_MAX_RESULTS }}
          SOCIALDATA_DAILY_TWEET_LIMIT: ${{ vars.SOCIALDATA_DAILY_TWEET_LIMIT }}
          SOCIALDATA_RUN_INTERVAL_HOURS: ${{ vars.SOCIALDATA_RUN_INTERVAL_HOURS }}
          SOCIALDATA_RUN_UTC_HOUR: ${{ vars.SOCIALDATA_RUN_UTC_HOUR }}
          SOCIALDATA_RUN_UTC_MINUTE_MAX: ${{ vars.SOCIALDATA_RUN_UTC_MINUTE_MAX }}
          SOCIALDATA_LIST_ID: ${{ vars.SOCIALDATA_LIST_ID }}
          SOCIALDATA_LIST_ENABLED: ${{ vars.SOCIALDATA_LIST_ENABLED }}
          SOCIALDATA_LIST_MAX_RESULTS: ${{ vars.SOCIALDATA_LIST_MAX_RESULTS }}
          SOCIALDATA_LIST_EXCLUDE: ${{ vars.SOCIALDATA_LIST_EXCLUDE }}
          TIKHUB_ENABLED: "0"
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          TIKHUB_API_BASE_URL: ${{ vars.TIKHUB_API_BASE_URL }}
          TIKHUB_QUERY: ${{ vars.TIKHUB_QUERY }}
          TIKHUB_PLATFORMS: ${{ vars.TIKHUB_PLATFORMS }}
          TIKHUB_MAX_RESULTS: ${{ vars.TIKHUB_MAX_RESULTS }}
          TIKHUB_DAILY_ITEM_LIMIT: ${{ vars.TIKHUB_DAILY_ITEM_LIMIT }}
          TIKHUB_RUN_INTERVAL_HOURS: ${{ vars.TIKHUB_RUN_INTERVAL_HOURS }}
          TIKHUB_RUN_UTC_HOUR: ${{ vars.TIKHUB_RUN_UTC_HOUR }}
          TIKHUB_RUN_UTC_MINUTE_MAX: ${{ vars.TIKHUB_RUN_UTC_MINUTE_MAX }}
          TIKHUB_FORCE_RUN: "0"
          RSS_MAX_FEEDS: ${{ vars.RSS_MAX_FEEDS || 20 }}
          # DeepSeek: powers title enhancement + zh translation fallback in
          # update_news.py itself (persona scoring gets its own copy of these
          # in the step below). All reads in update_news.py use
          # `os.environ.get(...) or default`, so leaving the optional vars
          # unset/empty is safe.
          TITLE_ENHANCE_MAX_PER_RUN: "0"
          REASON_ENHANCE_MAX_PER_RUN: "0"
        run: |
          if [ -f feeds/follow.opml ]; then
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 35 --translate-max-new 20 --rss-opml feeds/follow.opml --rss-max-feeds "${RSS_MAX_FEEDS:-20}"
          else
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 35 --translate-max-new 20
          fi

      - name: Generate RSS feed
        run: python scripts/generate_feed.py --data-dir data

      - name: Enrich public news with free source excerpts
        run: python scripts/free_news_content.py --data-dir data --max-fetch 40 --max-translate 20

      - name: Translate domestic institution summaries (free only)
        run: python scripts/translate-domestic-summaries.py --data-dir data --max-new 400

      - name: Backfill recent topic translations (free only)
        run: python scripts/build_topics.py --data-dir data --translate-max-new 20

      - name: Set up Node for the original reader
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Build the public reader from an explicit news projection
        run: |
          npm ci --no-audit --no-fund
          python scripts/export-public-news.py
          npm run public:build
          cp .public-export/site/index.html index.html
          cp .public-export/site/public-news.json public-news.json
          cp .public-export/site/assets/* assets/

      - name: Commit and push changes
        env:
          EMAIL_DIGEST_PUBLISH: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the whole data dir so newly added output files can never be
          # silently dropped again (the daily-brief/stories-merged freeze was
          # caused by a stale filename whitelist here). .gitignore keeps
          # data/email-digest.json out of this add.
          git add data/
          git add -- index.html public-news.json assets/public-projection.js assets/perspective.js assets/aihot-skin.css assets/research-analysis.js
          if [ -f data/email-digest.json ] && [ "$EMAIL_DIGEST_PUBLISH" = "1" ]; then
            git add -f data/email-digest.json
          fi
          # Self-check: fail loudly if anything under data/ is still unstaged,
          # instead of green-but-stale runs.
          if [ -n "$(git status --porcelain --untracked-files=all -- data/ | grep -v '^[MADRC]' || true)" ]; then
            echo "::error::Generated files under data/ were not staged:"
            git status --porcelain --untracked-files=all -- data/ | grep -v '^[MADRC]'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update ai news snapshot"
          # 运行期间有人推了同分支时裸 push 会被拒(non-fast-forward),整轮数据白跑。
          # rebase 到最新远端再推,最多重试 3 次;数据文件都是本轮生成的快照,rebase 无冲突风险。
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt), rebasing onto latest remote..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; exit 1; }
          done
          git push

      - name: Request Pages build for the generated snapshot
        if: steps.wechat.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.status')
            case "$status" in
              queued|building) echo "A Pages build is already active; verifying its output next." ;;
              *) exit 1 ;;
            esac
          fi

      - name: Verify published WeChat snapshot
        id: verify_wechat_pages
        if: steps.wechat.outcome == 'success'
        run: python scripts/wechat_cloud.py --verify-deployment data/bridge/wechat-accounts.json

      - name: Report WeChat collection and deployment
        if: always() && steps.wechat.outcome == 'success'
        env:
          COLLECTION_PARTIAL: ${{ steps.wechat.outputs.partial }}
          DEPLOYMENT_OUTCOME: ${{ steps.verify_wechat_pages.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          run = json.loads(Path(os.environ['RUNNER_TEMP'], 'wechat-result.json').read_text(encoding='utf-8'))
          status = json.loads(Path('data/source-status.json').read_text(encoding='utf-8'))
          bridge = next((s for s in status.get('sites', []) if s.get('site_id') == 'wechat_bridge'), {})
          version = subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD'], text=True).strip()
          deployed = '部署成功' if os.environ['DEPLOYMENT_OUTCOME'] == 'success' else '部署失败或未执行'
          state = {'complete': '采集完成', 'partial': '采集部分失败', 'failed': '采集不可用'}[run['collection_state']]
          summary = f"公众号：搜索候选名 {run['searched_accounts']} 个，覆盖 {run['covered_companies']} 个机构/{run['covered_accounts']} 个实际账号，新增归档 {run['added']} 条（含历史），近24小时入池 {bridge.get('item_count', 0)} 条，正常剔除 {run.get('rejected', 0)} 条，{state}，{deployed}，版本 {version}。"
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write(summary + '\n')
              handle.write('试点账号近7日有效文章数：' + json.dumps(run.get('pilot_recent_7d', {}), ensure_ascii=False) + '\n')
              if run.get('search_errors'):
                  handle.write('搜索失败详情：' + json.dumps(run['search_errors'], ensure_ascii=False) + '\n')
              if run.get('errors'):
                  from collections import Counter
                  handle.write('采集未完成：' + json.dumps(dict(Counter(e.get('error', 'unknown') for e in run['errors'])), ensure_ascii=False) + '\n')
          if run['collection_state'] == 'failed':
              raise SystemExit('WeChat collection unavailable; see run summary.')
          if run['collection_state'] == 'partial':
              print('::warning::Some searches or checks failed; verified records are published and details remain in the summary.')
          PY
