name: Validate Trend Reports
on:
  push:
    branches: [master]
    paths:
      - 'data/trends/**'
      - 'scripts/trend_reports.py'
      - 'scripts/trend_history.py'
      - 'config/trend_directions.json'
      - 'scripts/publish_trend_report.py'
      - 'tests/test_trend_reports.py'
      - 'tests/test_trend_history.py'
      - '.github/workflows/trend-reports.yml'
  pull_request:
    paths: ['data/trends/**', 'scripts/*trend*', 'tests/test_trend_reports.py', 'tests/test_trend_history.py', 'config/trend_directions.json']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q tests/test_trend_reports.py tests/test_trend_history.py
      - run: python scripts/trend_reports.py check --data-dir data
      - run: python scripts/trend_history.py --data-dir data --check
      - name: Request Pages for validated editorial data
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.status')
            case "$status" in queued|building) echo 'Existing Pages build is active' ;; *) exit 1 ;; esac
          fi
