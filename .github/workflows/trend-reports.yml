name: Validate Trend Reports
on:
  push:
    branches: [master]
    paths:
      - 'data/trends/**'
      - 'scripts/trend_reports.py'
      - 'scripts/trend_history.py'
      - 'history.html'
      - '.dockerignore'
      - 'Dockerfile'
      - 'assets/perspective.css'
      - 'assets/trend-history.js'
      - 'assets/trend-reports.js'
      - 'assets/perspective.js'
      - 'tests/trend-history.browser.mjs'
      - 'config/trend_directions.json'
      - 'scripts/publish_trend_report.py'
      - 'tests/test_trend_reports.py'
      - 'tests/test_trend_history.py'
      - '.github/workflows/trend-reports.yml'
  pull_request:
    paths: ['data/trends/**', 'scripts/*trend*', 'tests/test_trend_reports.py', 'tests/test_trend_history.py', 'config/trend_directions.json', 'assets/trend-history.js', 'assets/trend-reports.js', 'assets/perspective.js', 'tests/trend-history.browser.mjs']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q tests/test_trend_reports.py tests/test_trend_history.py
      - run: python scripts/trend_reports.py check --data-dir data
      - run: python scripts/trend_history.py --data-dir data --check
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify public history Docker context
        run: |
          docker build -f - . <<'DOCKER'
          FROM scratch
          COPY data/trends/ /trends/
          COPY history.html /history.html
          DOCKER
      - run: node scripts/package-public-site.ts
      - run: npm install --prefix /tmp/radar-history-browser --no-audit --no-fund @playwright/test@1.61.1
      - name: Use the runner browser or install Chromium when absent
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo 'RADAR_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            /tmp/radar-history-browser/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Check history and comparison in desktop and mobile browsers
        env:
          RADAR_PLAYWRIGHT_MODULE: /tmp/radar-history-browser/node_modules/@playwright/test/index.mjs
        run: |
          python -m http.server 8097 --bind 127.0.0.1 >/tmp/radar-history-browser.log 2>&1 &
          node --test tests/trend-history-contract.node.mjs
          node tests/trend-history.browser.mjs
      - name: Request Pages for validated editorial data
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.status')
            case "$status" in queued|building) echo 'Existing Pages build is active' ;; *) exit 1 ;; esac
          fi
